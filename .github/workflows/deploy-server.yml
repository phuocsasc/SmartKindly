name: Deploy Smartkindly Backend

on:
    push:
        branches: ["main"]
        paths:
            - "server/**"
    workflow_dispatch:

env:
    IMAGE_NAME: nhathao0303/smartkindly-server
    CONTAINER_NAME: smartkindly-server
    SERVER_PORT: 4101

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: ./server
                  file: ./server/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ github.run_number }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: SSH to Linux Server and Deploy
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  password: ${{ secrets.SERVER_PASSWORD }}
                  port: ${{ secrets.SERVER_PORT }}
                  script: |

                      echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

                      docker pull ${{ env.IMAGE_NAME }}:${{ github.run_number }}

                      docker stop ${{ env.CONTAINER_NAME }} || true

                      docker rm ${{ env.CONTAINER_NAME }} || true

                        docker run -d --name ${{ env.CONTAINER_NAME }} -p ${{ env.SERVER_PORT }}:8017 --restart=always \
                        -e MONGODB_URI=${{ secrets.MONGODB_URI }} \
                        -e DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
                        -e ACCESS_TOKEN_SECRET_SIGNATURE=${{ secrets.ACCESS_TOKEN_SECRET_SIGNATURE }} \
                        -e REFRESH_TOKEN_SECRET_SIGNATURE=${{ secrets.REFRESH_TOKEN_SECRET_SIGNATURE }} \
                        -e LOCAL_DEV_APP_PORT=${{ secrets.LOCAL_DEV_APP_PORT }} \
                        -e LOCAL_DEV_APP_HOST=${{ secrets.LOCAL_DEV_APP_HOST }} \
                        -e MAILER_SEND_API_KEY=${{ secrets.MAILER_SEND_API_KEY }} \
                        -e ADMIN_SENDER_EMAIL=${{ secrets.ADMIN_SENDER_EMAIL }} \
                        -e ADMIN_SENDER_NAME=${{ secrets.ADMIN_SENDER_NAME }} \
                        -e CLIENT_URL=${{ secrets.CLIENT_URL }} \
                        -e RESEND_API_KEY=${{ secrets.RESEND_API_KEY }} \
                        -e RESEND_ADMIN_SENDER_EMAIL=${{ secrets.RESEND_ADMIN_SENDER_EMAIL }} \
                        -e NPM_CONFIG_PRODUCTION=${{ secrets.NPM_CONFIG_PRODUCTION }} \
                        -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
                        ${{ env.IMAGE_NAME }}:${{ github.run_number }}

                      docker image prune -f
